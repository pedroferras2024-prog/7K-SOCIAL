<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Entrar - 7K.SOCIAL</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      font-size: 55px;
      font-weight: 900;
      color: #d4af37;
    }

    .social {
      text-align: center;
      letter-spacing: 7px;
      margin-bottom: 35px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;

      border: 1px solid #333;
      border-radius: 10px;

      background: #171717;
      color: #fff;

      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d4af37;
    }

    /* Área da senha */
    .senha-container {
      position: relative;
      width: 100%;
    }

    .senha-container input {
      padding-right: 55px;
    }

    /* Botão do olho */
    .mostrar-senha {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);

      width: 45px;
      height: 45px;

      padding: 0;
      margin: 0;

      background: transparent;
      color: #aaa;

      border: none;

      font-size: 20px;
      cursor: pointer;
    }

    .mostrar-senha:hover {
      color: #d4af37;
    }

    /* Botão entrar */
    .login-button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;

      border: none;
      border-radius: 10px;

      background: #d4af37;
      color: #000;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Mensagens */
    .mensagem {
      display: none;

      margin-top: 15px;
      padding: 12px;

      border-radius: 8px;

      text-align: center;
      font-size: 14px;
    }

    .erro {
      display: block;
      background: #3a0000;
      color: #ff7070;
      border: 1px solid #700000;
    }

    .sucesso {
      display: block;
      background: #0b2d12;
      color: #6cff86;
      border: 1px solid #176b28;
    }

    /* Links */
    .link {
      display: block;
      text-align: center;
      margin-top: 20px;

      color: #aaa;
      text-decoration: none;
    }

    .link:hover {
      color: #d4af37;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">7K</div>

    <div class="social">SOCIAL</div>

    <h1>Entrar</h1>

    <!-- E-MAIL -->
    <input
      type="email"
      id="email"
      placeholder="Seu e-mail"
      autocomplete="email"
    >

    <!-- SENHA -->
    <div class="senha-container">

      <input
        type="password"
        id="senha"
        placeholder="Sua senha"
        autocomplete="current-password"
      >

      <button
        type="button"
        id="mostrarSenha"
        class="mostrar-senha"
        aria-label="Mostrar senha"
      >
        👁️
      </button>

    </div>

    <!-- BOTÃO ENTRAR -->
    <button
      type="button"
      id="botaoLogin"
      class="login-button"
    >
      ENTRAR
    </button>

    <!-- MENSAGEM -->
    <div
      id="mensagem"
      class="mensagem"
    ></div>

    <!-- LINKS -->
    <a
      class="link"
      href="./Cadastro.html"
    >
      Ainda não tem uma conta? Criar conta
    </a>

    <a
      class="link"
      href="./index.html"
    >
      ← Voltar
    </a>

  </div>


  <script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://pnohbfnnnnpxdeqxwtsg.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_axxQbwjydBO6v5OXWbVkBQ_vg_slpRk";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // ==========================================
    // ELEMENTOS DA PÁGINA
    // ==========================================

    const emailInput =
      document.getElementById("email");

    const senhaInput =
      document.getElementById("senha");

    const botaoLogin =
      document.getElementById("botaoLogin");

    const mensagem =
      document.getElementById("mensagem");

    const mostrarSenha =
      document.getElementById("mostrarSenha");


    // ==========================================
    // MOSTRAR MENSAGEM
    // ==========================================

    function mostrarMensagem(texto, tipo) {

      mensagem.textContent = texto;

      mensagem.className =
        "mensagem " + tipo;
    }


    // ==========================================
    // MOSTRAR / ESCONDER SENHA
    // ==========================================

    mostrarSenha.addEventListener(
      "click",
      function () {

        if (senhaInput.type === "password") {

          senhaInput.type = "text";

          mostrarSenha.textContent = "🙈";

          mostrarSenha.setAttribute(
            "aria-label",
            "Esconder senha"
          );

        } else {

          senhaInput.type = "password";

          mostrarSenha.textContent = "👁️";

          mostrarSenha.setAttribute(
            "aria-label",
            "Mostrar senha"
          );

        }

      }
    );


    // ==========================================
    // FUNÇÃO DE LOGIN
    // ==========================================

    async function entrar() {

      const email =
        emailInput.value.trim();

      const senha =
        senhaInput.value;


      // ========================================
      // VERIFICAÇÕES
      // ========================================

      if (!email) {

        mostrarMensagem(
          "Digite seu e-mail.",
          "erro"
        );

        emailInput.focus();

        return;
      }


      if (!senha) {

        mostrarMensagem(
          "Digite sua senha.",
          "erro"
        );

        senhaInput.focus();

        return;
      }


      // ========================================
      // DESATIVA BOTÃO
      // ========================================

      botaoLogin.disabled = true;

      botaoLogin.textContent =
        "ENTRANDO...";


      try {

        // ======================================
        // LOGIN NO SUPABASE
        // ======================================

        const resultado =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: senha

          });


        const data = resultado.data;

        const error = resultado.error;


        // ======================================
        // ERRO
        // ======================================

        if (error) {

          console.error(
            "Erro no login:",
            error
          );

          throw error;
        }


        // ======================================
        // LOGIN REALIZADO
        // ======================================

        if (data && data.user) {

          mostrarMensagem(
            "Login realizado com sucesso! 🎉",
            "sucesso"
          );

          botaoLogin.textContent =
            "ENTROU!";


          // Guarda os dados da sessão
          // automaticamente pelo Supabase

          setTimeout(function () {

            window.location.href =
              "./Home.html";

          }, 1000);

        } else {

          throw new Error(
            "Não foi possível iniciar a sessão."
          );

        }

      } catch (error) {

        console.error(error);


        let mensagemErro =
          "Não foi possível entrar.";


        const textoErro =
          error.message
            ? error.message.toLowerCase()
            : "";


        // E-mail ou senha incorretos
        if (
          textoErro.includes(
            "invalid login credentials"
          )
        ) {

          mensagemErro =
            "E-mail ou senha incorretos.";

        }


        // E-mail ainda não confirmado
        else if (
          textoErro.includes(
            "email not confirmed"
          )
        ) {

          mensagemErro =
            "Confirme seu e-mail antes de entrar.";

        }


        // Outros erros
        else if (error.message) {

          mensagemErro =
            error.message;

        }


        mostrarMensagem(
          mensagemErro,
          "erro"
        );


        botaoLogin.disabled = false;

        botaoLogin.textContent =
          "ENTRAR";

      }

    }


    // ==========================================
    // CLIQUE NO BOTÃO
    // ==========================================

    botaoLogin.addEventListener(
      "click",
      entrar
    );


    // ==========================================
    // APERTAR ENTER PARA ENTRAR
    // ==========================================

    document.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Enter") {

          entrar();

        }

      }
    );

  </script>

</body>

</html>

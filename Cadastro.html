<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta - 7K.SOCIAL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      font-size: 55px;
      font-weight: 900;
      color: #d4af37;
    }

    .social {
      text-align: center;
      letter-spacing: 7px;
      margin-bottom: 35px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 1px solid #333;
      border-radius: 10px;
      background: #171717;
      color: #fff;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #d4af37;
      color: #000;
      font-size: 17px;
      font-weight: bold;
    }

    .voltar {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #aaa;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">7K</div>
    <div class="social">SOCIAL</div>

    <h1>Criar conta</h1>

    <input type="text" placeholder="Seu nome">

    <input type="text" placeholder="@seuusuario">

    <input type="email" placeholder="Seu e-mail">

    <input type="password" placeholder="Sua senha">

    <button onclick="criarConta()">CRIAR CONTA</button>

    <a class="voltar" href="index.html">← Voltar</a>

  </div>

  
  </script>

</body>
</html>

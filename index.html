<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>7K.SOCIAL</title>
  <style>

      display: flex;

      align-items: center;
      text-align: center;
    }

    .container {

    }

      font-weight: 900;

    h1 {

    }

    p {

      font-size: 17px;
